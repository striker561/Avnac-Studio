name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    outputs:
      is_stable: ${{ steps.check.outputs.is_stable }}
    steps:
      - name: Validate stable release tag
        id: check
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "is_stable=true" >> "$GITHUB_OUTPUT"
            echo "Stable release tag detected: $TAG"
          else
            echo "is_stable=false" >> "$GITHUB_OUTPUT"
            echo "Skipping release workflow for pre-release/non-stable tag: $TAG"
          fi

  test:
    runs-on: ubuntu-latest
    needs: validate-tag
    if: needs.validate-tag.outputs.is_stable == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm install
        working-directory: frontend

      # Test the version that is about to ship, not the one left in the repo.
      - name: Stamp version from tag
        run: |
          node scripts/set-version.mjs "${GITHUB_REF_NAME}"
          node scripts/set-version.mjs "${GITHUB_REF_NAME}" --check

      - name: Go tests
        run: go test ./...

      - name: Frontend typecheck
        run: npm run typecheck
        working-directory: frontend

      - name: Frontend unit tests
        run: npm run test:unit
        working-directory: frontend

      - name: Frontend feature tests
        run: npm run test:features
        working-directory: frontend

  build-linux-amd64:
    runs-on: ubuntu-24.04
    needs:
      - validate-tag
      - test
    if: needs.validate-tag.outputs.is_stable == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Create webkit2gtk-4.0 pkg-config compatibility shim
        run: |
          sudo mkdir -p /usr/local/lib/pkgconfig
          printf 'Name: webkit2gtk-4.0\nDescription: WebKit2 GTK+ (compat shim for 4.1)\nVersion: 2.44.0\nRequires: webkit2gtk-4.1\nCflags:\nLibs:\n' \
            | sudo tee /usr/local/lib/pkgconfig/webkit2gtk-4.0.pc
          echo "PKG_CONFIG_PATH=/usr/local/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Install frontend dependencies
        run: npm install
        working-directory: frontend

      - name: Stamp version from tag
        run: |
          node scripts/set-version.mjs "${GITHUB_REF_NAME}"
          node scripts/set-version.mjs "${GITHUB_REF_NAME}" --check

      - name: Build
        run: wails build -clean -tags webkit2gtk_4_1 -o avnac-studio-linux-amd64

      - name: Rename Linux binary
        run: |
          BIN_PATH="build/bin/avnac-studio-linux-amd64"
          if [ ! -f "$BIN_PATH" ]; then
            echo "Linux binary not found at $BIN_PATH"
            exit 1
          fi
          mkdir -p build/bin/renamed
          mv "$BIN_PATH" build/bin/renamed/avnac-studio-linux-amd64

      - uses: actions/upload-artifact@v4
        with:
          name: binaries-linux-amd64
          path: build/bin/renamed/*

  build-macos:
    runs-on: macos-latest
    needs:
      - validate-tag
      - test
    if: needs.validate-tag.outputs.is_stable == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Install frontend dependencies
        run: npm install
        working-directory: frontend

      - name: Stamp version from tag
        run: |
          node scripts/set-version.mjs "${GITHUB_REF_NAME}"
          node scripts/set-version.mjs "${GITHUB_REF_NAME}" --check

      - name: Build macOS ARM64
        run: wails build -clean -platform darwin/arm64 -o avnac-studio-macos-arm64

      - name: Package ARM64 DMG
        run: |
          mkdir -p artifacts
          APP_NAME=$(node -p "const fs=require('fs');const cfg=JSON.parse(fs.readFileSync('wails.json','utf8'));cfg.outputfilename || cfg.name")
          APP_PATH="build/bin/${APP_NAME}.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "No .app produced by ARM64 build at $APP_PATH"
            exit 1
          fi
          hdiutil create \
            -volname "Avnac Studio" \
            -srcfolder "$APP_PATH" \
            -ov -format UDZO \
            artifacts/avnac-studio-macos-arm64.dmg

      - name: Build macOS AMD64
        run: wails build -clean -platform darwin/amd64 -o avnac-studio-macos-amd64

      - name: Package AMD64 DMG
        run: |
          APP_NAME=$(node -p "const fs=require('fs');const cfg=JSON.parse(fs.readFileSync('wails.json','utf8'));cfg.outputfilename || cfg.name")
          APP_PATH="build/bin/${APP_NAME}.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "No .app produced by AMD64 build at $APP_PATH"
            exit 1
          fi
          hdiutil create \
            -volname "Avnac Studio" \
            -srcfolder "$APP_PATH" \
            -ov -format UDZO \
            artifacts/avnac-studio-macos-amd64.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: binaries-macos
          path: artifacts/*.dmg

  build-windows-amd64:
    runs-on: windows-latest
    needs:
      - validate-tag
      - test
    if: needs.validate-tag.outputs.is_stable == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install NSIS
        run: choco install nsis -y

      - name: Add NSIS to PATH
        shell: pwsh
        run: |
          $candidates = @(
            "$env:ChocolateyInstall\bin",
            "${env:ProgramFiles(x86)}\NSIS",
            "$env:ProgramFiles\NSIS"
          )
          foreach ($candidate in $candidates) {
            if (Test-Path $candidate) {
              Add-Content -Path $env:GITHUB_PATH -Value $candidate
              $env:PATH = "$candidate;$env:PATH"
            }
          }
          $makensis = Get-Command makensis -ErrorAction SilentlyContinue
          if (-not $makensis) {
            throw "makensis not found after NSIS installation"
          }
          Write-Host "Using makensis at $($makensis.Source)"

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Install frontend dependencies
        run: npm install
        working-directory: frontend

      - name: Stamp version from tag
        shell: pwsh
        run: |
          node scripts/set-version.mjs "$env:GITHUB_REF_NAME"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/set-version.mjs "$env:GITHUB_REF_NAME" --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build
        run: wails build -clean -nsis -o avnac-studio-windows-amd64

      - name: Rename Windows outputs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build\bin\renamed
          if (Test-Path build\bin\avnac-studio-windows-amd64.exe) {
            Move-Item build\bin\avnac-studio-windows-amd64.exe build\bin\renamed\avnac-studio-windows-amd64.exe
          }
          $installer = Get-ChildItem build\bin\*installer.exe -ErrorAction SilentlyContinue | Where-Object { $_.Name -like '*avnac-studio-windows-amd64*' -or $_.Name -like '*installer*' } | Select-Object -First 1
          if (-not $installer) {
            throw "Windows installer not found in build/bin"
          }
          Move-Item $installer.FullName build\bin\renamed\avnac-studio-windows-amd64-installer.exe

      - uses: actions/upload-artifact@v4
        with:
          name: binaries-windows-amd64
          path: build/bin/renamed/*

  release:
    runs-on: ubuntu-latest
    needs:
      - validate-tag
      - build-linux-amd64
      - build-macos
      - build-windows-amd64
    if: needs.validate-tag.outputs.is_stable == 'true'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CURR_TAG="${GITHUB_REF#refs/tags/}"
          # The nearest lower tag, by version, that this one descends from. Taking
          # a fixed line of the tag list assumed every release is cut from the
          # newest tag, so a hotfix compared against a tag newer than itself.
          PREV_TAG=""
          while IFS= read -r TAG; do
            if [ "$TAG" = "$CURR_TAG" ]; then continue; fi
            if git merge-base --is-ancestor "$TAG" "$CURR_TAG" 2>/dev/null; then
              PREV_TAG="$TAG"
              break
            fi
          done < <(git tag --sort=-version:refname | grep -E '^v[0-9]')

          if [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..${CURR_TAG}"
          else
            RANGE="${CURR_TAG}"
          fi
          echo "Collecting changes in ${RANGE}"

          # A PR number appears either in a merge commit subject
          # ("Merge pull request #27 from ...") or as a squash-merge suffix
          # ("fix(editor): keep the typing (#30)").
          git log "$RANGE" --pretty=format:"%s" \
            | grep -oE 'Merge pull request #[0-9]+|\(#[0-9]+\)$' \
            | grep -oE '[0-9]+' \
            | sort -unr > pr_numbers.txt

          echo "## What's changed" > release_notes.md
          echo "" >> release_notes.md

          COUNT=0
          while IFS= read -r NUM; do
            if [ -z "$NUM" ]; then continue; fi

            PR=$(curl -sf \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls/${NUM}") || continue

            # A PR referenced in the range that never merged is not part of it.
            if [ "$(printf '%s' "$PR" | jq -r '.merged_at // "null"')" = "null" ]; then
              continue
            fi

            TITLE=$(printf '%s' "$PR" | jq -r '.title')
            LOGIN=$(printf '%s' "$PR" | jq -r '.user.login // "unknown"')
            URL=$(printf '%s' "$PR" | jq -r '.html_url')
            BODY=$(printf '%s' "$PR" | jq -r '.body // ""')

            {
              echo "### [#${NUM}](${URL}) - ${TITLE}"
              echo ""
              echo "by @${LOGIN}"
              echo ""
            } >> release_notes.md

            # The description, verbatim, under the PR it belongs to. Written with
            # printf rather than echo so backslashes in the body stay as they are.
            if [ -n "$(printf '%s' "$BODY" | tr -d '[:space:]')" ]; then
              printf '%s\n\n' "$BODY" >> release_notes.md
            fi

            COUNT=$((COUNT + 1))
          done < pr_numbers.txt

          # A release cut straight from commits has no PRs to describe.
          if [ "$COUNT" -eq 0 ]; then
            git log "$RANGE" --no-merges --pretty=format:"- %s" >> release_notes.md
            echo "" >> release_notes.md
          fi

          USERS_FILE=$(mktemp)

          while IFS= read -r HASH; do
            if [ -z "$HASH" ]; then continue; fi
            GH_LOGIN=$(curl -sf \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${HASH}" \
              | jq -r '.author.login // empty' 2>/dev/null || echo "")
            if [ -n "$GH_LOGIN" ]; then
              echo "$GH_LOGIN" >> "$USERS_FILE"
            fi
          done < <(git log "$RANGE" --pretty=format:"%H" --no-merges)

          if [ -s "$USERS_FILE" ]; then
            echo "### Contributors" >> release_notes.md
            echo "" >> release_notes.md
            echo "<table><tr>" >> release_notes.md
            for USER in $(sort -u "$USERS_FILE"); do
              printf '  <td align="center"><a href="https://github.com/%s"><img src="https://github.com/%s.png?size=72" width="72" height="72" style="border-radius:50%%" /><br /><b>@%s</b></a></td>\n' \
                "$USER" "$USER" "$USER" >> release_notes.md
            done
            echo "</tr></table>" >> release_notes.md
            echo "" >> release_notes.md
          fi

          rm -f "$USERS_FILE"
          echo "Wrote release notes for ${COUNT} PR(s)"

      - uses: actions/download-artifact@v4
        with:
          path: binaries
          merge-multiple: true

      - name: Verify release artifacts
        run: |
          test -f binaries/avnac-studio-linux-amd64
          test -f binaries/avnac-studio-macos-arm64.dmg
          test -f binaries/avnac-studio-macos-amd64.dmg
          test -f binaries/avnac-studio-windows-amd64-installer.exe

      - name: Generate checksums
        run: |
          cd binaries
          sha256sum avnac-studio-* > SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          # The body is built above from each PR and its description. Letting
          # GitHub generate notes as well would list every PR a second time.
          generate_release_notes: false
          body_path: release_notes.md
          files: binaries/*
